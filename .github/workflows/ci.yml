name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  dashes:
    name: No em or en dashes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Search for dashes
        run: |
          if git grep -nI --untracked -e "$(printf '\342\200\223')" -e "$(printf '\342\200\224')"; then
            echo "Found an em or en dash. Use a comma, colon, full stop or brackets instead."
            exit 1
          fi
          echo ok

  scripts:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $r = Invoke-ScriptAnalyzer -Path scripts/install.ps1 -Severity Warning,Error
          $r | Format-Table -AutoSize
          if ($r) { exit 1 }

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck scripts/install.sh scripts/bench-daemon.sh

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

  build:
    name: Build without cgo
    needs: [dashes, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Cross-compile
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist
          for os in windows darwin linux; do
            for arch in amd64 arm64; do
              ext=""
              if [ "$os" = windows ]; then ext=".exe"; fi
              GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w" -o "dist/grit-${os}-${arch}${ext}" ./cmd/grit
              # The server must cross-compile too, but it is not a release asset.
              GOOS=$os GOARCH=$arch go build -trimpath -o /dev/null ./cmd/gritd
            done
          done
          cd dist && sha256sum grit-* > checksums.txt && cat checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes $pre
